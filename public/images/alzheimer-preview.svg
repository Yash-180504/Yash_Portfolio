<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0a14"/>
      <stop offset="100%" style="stop-color:#110d1a"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c2a4ff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#7b42ff;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7b42ff"/>
      <stop offset="100%" style="stop-color:#c2a4ff"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8b04a"/>
      <stop offset="100%" style="stop-color:#f4c87d"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ff9999"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#c2a4ff" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Header bar -->
  <rect x="0" y="0" width="800" height="48" fill="rgba(194,164,255,0.05)" rx="0"/>
  <rect x="0" y="47" width="800" height="1" fill="rgba(194,164,255,0.15)"/>
  <circle cx="20" cy="24" r="6" fill="#ff6b6b" opacity="0.8"/>
  <circle cx="38" cy="24" r="6" fill="#e8b04a" opacity="0.8"/>
  <circle cx="56" cy="24" r="6" fill="#50fa7b" opacity="0.8"/>
  <text x="400" y="30" font-family="monospace" font-size="13" fill="rgba(194,164,255,0.6)" text-anchor="middle" letter-spacing="3">ALZHEIMER'S DISEASE DETECTION — ML CLASSIFIER</text>

  <!-- LEFT PANEL: Brain scan visualization -->
  <rect x="30" y="68" width="340" height="310" rx="10" fill="rgba(194,164,255,0.03)" stroke="rgba(194,164,255,0.12)" stroke-width="1"/>
  <text x="200" y="92" font-family="monospace" font-size="11" fill="rgba(194,164,255,0.4)" text-anchor="middle" letter-spacing="2">MRI SCAN — AXIAL VIEW</text>

  <!-- Brain shape (stylized) -->
  <g transform="translate(200, 210)" filter="url(#softglow)">
    <!-- Outer brain silhouette -->
    <ellipse cx="0" cy="0" rx="105" ry="90" fill="none" stroke="url(#brainGrad)" stroke-width="2" opacity="0.6"/>
    <!-- Left hemisphere -->
    <path d="M-10,-85 C-60,-80 -105,-50 -105,0 C-105,50 -70,85 -10,88" fill="none" stroke="url(#brainGrad)" stroke-width="1.5" opacity="0.8"/>
    <!-- Right hemisphere -->
    <path d="M10,-85 C60,-80 105,-50 105,0 C105,50 70,85 10,88" fill="none" stroke="url(#brainGrad)" stroke-width="1.5" opacity="0.8"/>
    <!-- Center divide -->
    <line x1="0" y1="-85" x2="0" y2="88" stroke="rgba(194,164,255,0.3)" stroke-width="1" stroke-dasharray="4,4"/>
    <!-- Brain folds left -->
    <path d="M-80,-30 C-60,-50 -40,-20 -55,10" fill="none" stroke="rgba(194,164,255,0.5)" stroke-width="1.5"/>
    <path d="M-90,20 C-70,5 -50,30 -65,55" fill="none" stroke="rgba(194,164,255,0.5)" stroke-width="1.5"/>
    <path d="M-50,-60 C-30,-70 -20,-45 -35,-25" fill="none" stroke="rgba(194,164,255,0.4)" stroke-width="1.5"/>
    <!-- Brain folds right -->
    <path d="M80,-30 C60,-50 40,-20 55,10" fill="none" stroke="rgba(194,164,255,0.5)" stroke-width="1.5"/>
    <path d="M90,20 C70,5 50,30 65,55" fill="none" stroke="rgba(194,164,255,0.5)" stroke-width="1.5"/>
    <path d="M50,-60 C30,-70 20,-45 35,-25" fill="none" stroke="rgba(194,164,255,0.4)" stroke-width="1.5"/>
    <!-- Highlighted anomaly region -->
    <ellipse cx="-35" cy="25" rx="28" ry="22" fill="rgba(255,107,107,0.15)" stroke="rgba(255,107,107,0.6)" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="-35" cy="25" r="5" fill="rgba(255,107,107,0.8)" filter="url(#glow)"/>
    <!-- Scan lines -->
    <line x1="-105" y1="-20" x2="105" y2="-20" stroke="rgba(194,164,255,0.08)" stroke-width="1"/>
    <line x1="-105" y1="0" x2="105" y2="0" stroke="rgba(194,164,255,0.12)" stroke-width="1"/>
    <line x1="-105" y1="20" x2="105" y2="20" stroke="rgba(194,164,255,0.08)" stroke-width="1"/>
  </g>

  <!-- Anomaly label -->
  <line x1="155" y1="228" x2="130" y2="310" stroke="rgba(255,107,107,0.5)" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="90" y="322" font-family="monospace" font-size="10" fill="rgba(255,107,107,0.8)">⚠ ANOMALY DETECTED</text>

  <!-- Confidence badge -->
  <rect x="140" y="340" width="120" height="28" rx="14" fill="rgba(255,107,107,0.1)" stroke="rgba(255,107,107,0.4)" stroke-width="1"/>
  <text x="200" y="359" font-family="monospace" font-size="11" fill="#ff9999" text-anchor="middle">CONFIDENCE: 94.2%</text>

  <!-- RIGHT PANEL: Classification results -->
  <rect x="390" y="68" width="380" height="310" rx="10" fill="rgba(194,164,255,0.03)" stroke="rgba(194,164,255,0.12)" stroke-width="1"/>
  <text x="580" y="92" font-family="monospace" font-size="11" fill="rgba(194,164,255,0.4)" text-anchor="middle" letter-spacing="2">CLASSIFICATION RESULTS</text>

  <!-- Class bars -->
  <!-- Non Demented -->
  <text x="410" y="128" font-family="monospace" font-size="11" fill="rgba(234,229,236,0.7)">Non Demented</text>
  <rect x="410" y="134" width="320" height="14" rx="7" fill="rgba(255,255,255,0.05)"/>
  <rect x="410" y="134" width="58" height="14" rx="7" fill="url(#barGrad)" opacity="0.7"/>
  <text x="476" y="145" font-family="monospace" font-size="10" fill="rgba(194,164,255,0.8)">18.1%</text>

  <!-- Very Mild -->
  <text x="410" y="172" font-family="monospace" font-size="11" fill="rgba(234,229,236,0.7)">Very Mild Demented</text>
  <rect x="410" y="178" width="320" height="14" rx="7" fill="rgba(255,255,255,0.05)"/>
  <rect x="410" y="178" width="96" height="14" rx="7" fill="url(#barGrad)" opacity="0.8"/>
  <text x="514" y="189" font-family="monospace" font-size="10" fill="rgba(194,164,255,0.8)">30.0%</text>

  <!-- Mild -->
  <text x="410" y="216" font-family="monospace" font-size="11" fill="rgba(234,229,236,0.7)">Mild Demented</text>
  <rect x="410" y="222" width="320" height="14" rx="7" fill="rgba(255,255,255,0.05)"/>
  <rect x="410" y="222" width="144" height="14" rx="7" fill="url(#barGrad2)" opacity="0.85"/>
  <text x="562" y="233" font-family="monospace" font-size="10" fill="rgba(232,176,74,0.9)">45.0%</text>

  <!-- Moderate — highest, highlighted -->
  <text x="410" y="260" font-family="monospace" font-size="11" fill="#ff9999">Moderate Demented ◀ PREDICTED</text>
  <rect x="410" y="266" width="320" height="18" rx="9" fill="rgba(255,107,107,0.08)"/>
  <rect x="410" y="266" width="301" height="18" rx="9" fill="url(#barGrad3)" opacity="0.9" filter="url(#glow)"/>
  <text x="718" y="279" font-family="monospace" font-size="11" fill="#ff9999" font-weight="bold">94.2%</text>

  <!-- Divider -->
  <line x1="410" y1="305" x2="750" y2="305" stroke="rgba(194,164,255,0.1)" stroke-width="1"/>

  <!-- Model info -->
  <text x="410" y="325" font-family="monospace" font-size="10" fill="rgba(194,164,255,0.4)">MODEL</text>
  <text x="500" y="325" font-family="monospace" font-size="10" fill="rgba(234,229,236,0.6)">Random Forest + SVM Ensemble</text>
  <text x="410" y="343" font-family="monospace" font-size="10" fill="rgba(194,164,255,0.4)">DATASET</text>
  <text x="500" y="343" font-family="monospace" font-size="10" fill="rgba(234,229,236,0.6)">OASIS — 6,400 MRI Images</text>
  <text x="410" y="361" font-family="monospace" font-size="10" fill="rgba(194,164,255,0.4)">ACCURACY</text>
  <text x="500" y="361" font-family="monospace" font-size="10" fill="rgba(80,250,123,0.8)">96.8%  ↑</text>

  <!-- Bottom status bar -->
  <rect x="0" y="402" width="800" height="48" fill="rgba(194,164,255,0.03)"/>
  <rect x="0" y="402" width="800" height="1" fill="rgba(194,164,255,0.1)"/>
  <circle cx="30" cy="426" r="5" fill="rgba(80,250,123,0.8)" filter="url(#glow)"/>
  <text x="44" y="430" font-family="monospace" font-size="11" fill="rgba(80,250,123,0.7)">MODEL LOADED</text>
  <text x="400" y="430" font-family="monospace" font-size="11" fill="rgba(194,164,255,0.4)" text-anchor="middle">scikit-learn · pandas · numpy · matplotlib</text>
  <text x="760" y="430" font-family="monospace" font-size="11" fill="rgba(194,164,255,0.3)" text-anchor="end">Python 3.11</text>
</svg>
